name: Build APK
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: "8.7" }
      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon
      - name: Check source project size (limit 25 MiB)
        run: |
          s=$(du -sb --exclude=.git --exclude=app/build . | cut -f1)
          echo "Source project size: $((s/1024/1024)) MiB"
          test "$s" -le 26214400 || (echo "Source project is larger than 25 MiB" && exit 1)
      - uses: actions/upload-artifact@v4
        with: { name: PortYouStudio-apk, path: app/build/outputs/apk/release/*.apk }
